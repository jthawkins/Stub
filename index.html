<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Stub: your film diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F6F6F9;--surface:#FFFFFF;--surface-2:#EDEDF3;--ink:#15151D;--muted:#666679;
  --line:#DEDEE8;--line-strong:#C9C9D8;--accent:#4F46E5;--accent-ink:#FFFFFF;--accent-soft:#E7E6FB;
  --star:#E49B0F;--danger:#B92D45;--shadow:0 18px 50px rgba(20,20,40,.18);
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F15;--surface:#181821;--surface-2:#22222D;--ink:#F1F1F6;--muted:#9C9CB0;
    --line:#2B2B38;--line-strong:#3A3A4A;--accent:#8F92FA;--accent-ink:#0D0D17;--accent-soft:#25254A;
    --star:#F2B13A;--danger:#FF7A8E;--shadow:0 18px 50px rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F15;--surface:#181821;--surface-2:#22222D;--ink:#F1F1F6;--muted:#9C9CB0;
  --line:#2B2B38;--line-strong:#3A3A4A;--accent:#8F92FA;--accent-ink:#0D0D17;--accent-soft:#25254A;
  --star:#F2B13A;--danger:#FF7A8E;--shadow:0 18px 50px rgba(0,0,0,.55);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ico{flex:none}

/* Layout */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.content{min-width:0}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:24px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.brand{font:700 28px/1 var(--font-d);letter-spacing:-.03em;padding:4px 10px}
.btn-log{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn-log span{flex:1;text-align:left}
kbd{font:500 12px/1 var(--font-b);padding:4px 7px;border-radius:6px;background:rgba(128,128,150,.22);color:inherit}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.foot-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-align:left}
.foot-btn:hover{background:var(--surface-2);color:var(--ink)}
.foot-confirm{padding:9px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.foot-confirm div{display:flex;gap:14px}
.topbar{display:none}
.main{padding:44px clamp(20px,4vw,56px) 96px;max-width:1280px}

/* Page head */
.page-head{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.page-head h1{font:700 clamp(30px,4.2vw,46px)/1.04 var(--font-d);letter-spacing:-.03em}
.sub{color:var(--muted)}
.search-launch{display:flex;align-items:center;gap:14px;width:100%;max-width:660px;height:58px;padding:0 16px;margin-top:8px;border:1px solid var(--line-strong);border-radius:16px;background:var(--surface);color:var(--muted);font-size:17px;cursor:pointer;text-align:left}
.search-launch:hover{border-color:var(--accent)}
.search-launch span{flex:1}

/* Controls */
.filters{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1px solid var(--line-strong);border-radius:999px;background:transparent;font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .ico{width:14px;height:14px}
.selects{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.field{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field select{padding:7px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:7px 12px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn .ico{width:17px;height:17px}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link.danger{color:var(--danger)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}

/* Posters and grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 18px}
.film{display:flex;flex-direction:column;gap:9px;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit;min-width:0}
.poster{position:relative;display:block;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface-2);box-shadow:inset 0 0 0 1px rgba(128,128,150,.2)}
.poster svg{display:block;width:100%;height:100%}
.film:hover .poster::after,.film:focus-visible .poster::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 3px var(--accent)}
.badge{position:absolute;right:6px;bottom:6px;display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px;border-radius:12px;background:rgba(14,14,20,.84);color:#fff;font-size:12px;font-weight:600}
.badge .ico{width:14px;height:14px}
.badge.seen .ico{color:#6EE7A0}
.badge.want .ico{color:#B9BBFF}
.cap{display:flex;flex-direction:column}
.cap .t{font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .y{color:var(--muted);font-size:13px}
.stars{position:relative;display:inline-block;line-height:1;white-space:nowrap;color:var(--line-strong);font-size:15px;vertical-align:middle}
.stars::before{content:"★★★★★"}
.stars>span{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.footnote{margin-top:48px;font-size:13px;color:var(--muted)}
.empty{max-width:460px;padding:40px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font:700 24px/1.15 var(--font-d);letter-spacing:-.02em}
.empty p{color:var(--muted);margin-bottom:6px}

/* Diary */
.month{font:700 20px/1.2 var(--font-d);letter-spacing:-.01em;margin:36px 0 8px}
.month:first-of-type{margin-top:0}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:46px 52px minmax(0,1fr);gap:16px;align-items:center;width:100%;padding:12px 8px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:hover{background:var(--surface)}
.day{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.day b{font:700 22px/1 var(--font-d)}
.day span{font-size:12px;color:var(--muted)}
.info{display:flex;flex-direction:column;gap:3px;min-width:0}
.info .t{font-weight:600}
.info .t .y{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.info .m{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info .snip{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Tonight picker */
.tonight{display:flex;flex-direction:column;gap:16px;padding:24px;margin-bottom:34px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tonight h2{font:700 22px/1.2 var(--font-d);letter-spacing:-.02em}
.tonight .group{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tonight .group>span{font-size:13px;color:var(--muted);min-width:96px}
.pick{display:grid;grid-template-columns:96px 1fr;gap:18px;padding-top:6px}
.pick h3{font:700 22px/1.15 var(--font-d);letter-spacing:-.02em}
.pick p{margin-top:4px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.note{color:var(--muted)}

/* Lists */
.new-list{display:flex;gap:10px;max-width:460px;margin-bottom:34px}
.new-list input,.inline-new input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.list-block{margin-bottom:44px}
.list-head{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.list-head h2{font:700 24px/1.15 var(--font-d);letter-spacing:-.02em}

/* Stats */
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.big{display:flex;flex-direction:column;gap:2px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.big b{font:700 34px/1.1 var(--font-d);letter-spacing:-.03em}
.big span{font-size:13px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.panel h2{font:700 18px/1.2 var(--font-d);margin-bottom:16px;letter-spacing:-.01em}
.dist{display:flex;align-items:flex-end;gap:6px;height:170px}
.dist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.dist i{display:block;width:100%;background:var(--star);border-radius:4px 4px 0 0;min-height:2px}
.dist .n{font-size:12px;color:var(--muted);height:16px}
.dist .x{font-size:11px;color:var(--muted)}
.bar{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
.bar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .n{text-align:right;color:var(--muted);font-size:13px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.5);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;z-index:40}
.scrim.open{opacity:1;visibility:visible;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);box-shadow:var(--shadow);transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;z-index:41;overflow-y:auto;overscroll-behavior:contain;padding:calc(10px + env(safe-area-inset-top,0px)) 26px calc(36px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.d-top{display:flex;justify-content:flex-end;margin-right:-10px}
.d-hero{display:grid;grid-template-columns:128px 1fr;gap:20px;margin-top:2px}
.d-hero h2{font:700 27px/1.08 var(--font-d);letter-spacing:-.025em;margin-bottom:8px}
.d-hero .meta{color:var(--muted);font-size:14px}
.d-hero .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.blurb{margin:20px 0 4px;font-size:16px;line-height:1.55}
.d-sec{margin-top:26px}
.d-sec h3{font:700 16px/1.2 var(--font-d);margin-bottom:10px}
.rate-row{display:flex;align-items:center;gap:14px}
.rate{display:inline-block;cursor:pointer;touch-action:manipulation;border-radius:8px}
.rate .stars{font-size:42px}
.rate-val{font:700 20px/1 var(--font-d);min-width:84px}
.hint{margin-top:8px;font-size:13px;color:var(--muted)}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.views{list-style:none;margin:0;padding:0}
.views>li{padding:14px 0;border-top:1px solid var(--line)}
.v-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.v-head .v-date{font-weight:600}
.v-head .link{margin-left:auto}
.review{margin-top:8px;white-space:pre-wrap}
.edit{display:flex;flex-direction:column;gap:14px}
.edit label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.edit label.check{flex-direction:row;color:var(--ink)}
.edit input[type="date"],.edit textarea{padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
.edit textarea{resize:vertical;min-height:96px}
.inline-new{display:inline-flex;gap:8px;margin-top:10px;width:100%}

/* Palette */
.palette{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:max(12vh,calc(24px + env(safe-area-inset-top,0px))) 16px 16px}
.palette[hidden]{display:none}
.p-scrim{position:absolute;inset:0;background:rgba(10,10,20,.55)}
.p-box{position:relative;width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.p-input{display:flex;align-items:center;gap:12px;padding:0 10px 0 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.p-input:focus-within{box-shadow:inset 0 -2px 0 var(--accent)}
.p-input input{flex:1;min-width:0;height:62px;border:0;background:transparent;font-size:18px;font-weight:500;outline:none;color:var(--ink)}
.p-list{list-style:none;margin:0;padding:8px;max-height:min(52vh,430px);overflow:auto}
.p-head{padding:8px 10px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.p-item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}
.p-item[aria-selected="true"]{background:var(--accent-soft)}
.p-item .info .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-item .sub{font-size:13px}
.p-item .st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.p-empty{padding:18px 12px;color:var(--muted)}
.p-hint{padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;visibility:hidden;display:flex;align-items:center;gap:18px;max-width:min(520px,calc(100vw - 32px));padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500;z-index:80;transition:opacity .2s,transform .2s,visibility 0s .2s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
.toast .link{color:inherit;flex:none}

/* Small screens */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--surface)}
  .side .brand,.side .btn-log,.side .side-foot{display:none}
  .nav{flex-direction:row;flex:1;gap:0}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;align-items:center;justify-content:center;position:relative}
  .nav .count{position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:10px;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:8px}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;font-size:24px}
  .top-actions{display:flex;align-items:center;gap:6px}
  .main{padding:24px 16px 120px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 12px}
  .search-launch kbd{display:none}
  .drawer{top:auto;left:0;right:0;width:100%;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;transform:translateY(100%);padding-top:8px;padding-left:20px;padding-right:20px}
  .drawer.open{transform:none}
  .d-hero{grid-template-columns:104px 1fr;gap:16px}
  .d-hero h2{font-size:23px}
  .rate .stars{font-size:38px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .pick{grid-template-columns:80px 1fr}
  .tonight .group>span{min-width:100%}
  .row{grid-template-columns:38px 46px minmax(0,1fr);gap:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* Live version additions */
.poster img.pimg{display:block;width:100%;height:100%;object-fit:cover}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.vh:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px;max-width:760px}
.stack .panel h2{margin-bottom:8px}
.stack .panel>p{margin-bottom:12px}
.stack .panel>p.hint{margin-top:8px;margin-bottom:0}
.setup{max-width:560px;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.setup h2{font:700 24px/1.15 var(--font-d);letter-spacing:-.02em}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:6px 0 10px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.sumlist{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:4px}
.checks{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.steps{margin:0 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plain{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
details{margin:10px 0}
details summary{cursor:pointer;font-weight:600}
.err{color:var(--danger)}
.load-more{display:flex;justify-content:center;margin:32px 0 8px;text-align:center}
.btn:disabled{opacity:.6;cursor:default}

/* Social additions */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.post{display:grid;grid-template-columns:44px minmax(0,1fr) 64px;gap:14px;padding:18px 0;border-top:1px solid var(--line)}
.post.noav{grid-template-columns:minmax(0,1fr) 64px}
.post-body{min-width:0}
.post-head{margin:0 0 4px}
.post-head .y{color:var(--muted);font-size:13px}
.post-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0;font-size:14px}
.post .review{margin-top:6px}
.post-poster{border:0;background:none;padding:0;cursor:pointer;align-self:start}
.name-link{background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;font-size:inherit}
.name-link:hover{text-decoration:underline;text-underline-offset:3px}
.avatar{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font:700 18px/1 var(--font-d);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar.sm{width:30px;height:30px;font-size:13px}
.avatar.lg{width:88px;height:88px;font-size:36px}
.like{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 11px;border:1px solid var(--line-strong);border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.like:hover{border-color:var(--ink);color:var(--ink)}
.like .ico{width:16px;height:16px}
.like[aria-pressed="true"]{color:#E0366B;border-color:#E0366B}
.like[aria-pressed="true"] .ico{fill:currentColor}
.people{list-style:none;margin:0;padding:0}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.person .who{display:flex;flex-direction:column;min-width:0}
.person .who .un{color:var(--muted);font-size:13px}
.search-people{max-width:460px;margin-bottom:18px}
.search-people input{width:100%;padding:11px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:15px}
.profile-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
.counts{display:flex;gap:24px;margin:12px 0 0;flex-wrap:wrap}
.counts span{display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.counts b{font:700 20px/1.2 var(--font-d);color:var(--ink)}
.friends-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.friends-list li{display:flex;align-items:center;gap:10px}
.friends-list .stars,.friends-list .muted{margin-left:auto}
.field-col{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.field-col input,.field-col textarea,.field-col select{padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;width:100%}
@media (max-width:820px){
  .nav button{font-size:10.5px}
  .post{grid-template-columns:40px minmax(0,1fr) 54px;gap:12px}
  .post.noav{grid-template-columns:minmax(0,1fr) 54px}
  .avatar{width:40px;height:40px;font-size:16px}
  .avatar.lg{width:72px;height:72px;font-size:30px}
}

/* ===== Cinema noir theme layer (overrides everything above) ===== */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --bg:#0C0B0A;--surface:#161412;--surface-2:#211E1B;--ink:#F2EEE8;--muted:#A39B91;
  --line:#2A2622;--line-strong:#3A352F;--accent:#E8A33D;--accent-ink:#1A1208;--accent-soft:#2E2312;
  --star:#E8A33D;--danger:#FF7A8E;--shadow:0 18px 50px rgba(0,0,0,.6);
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F6F3EE;--surface:#FFFFFF;--surface-2:#ECE7DF;--ink:#1A1712;--muted:#675F55;
  --line:#DDD6CC;--line-strong:#C2B9AC;--accent:#9A5B00;--accent-ink:#FFFFFF;--accent-soft:#F4E5C8;
  --star:#C7790A;--danger:#B92D45;--shadow:0 18px 50px rgba(40,30,10,.18);
  --font-d:'Fraunces',Georgia,'Times New Roman',serif;color-scheme:light;
}
.brand{font:italic 400 32px/1 var(--font-d);letter-spacing:-.01em}
.page-head h1{font-weight:400;letter-spacing:-.025em;line-height:1.02}
.d-hero h2,.list-head h2,.panel h2,.empty h2,.setup h2,.tonight h2,.pick h3,.month,.big b,.profile-head h1{font-weight:400;letter-spacing:-.015em}
.badge{background:rgba(12,11,10,.9)}
.badge.seen .ico,.badge.want .ico{color:#E8A33D}
.poster{border-radius:2px}
.film:hover .poster::after,.film:focus-visible .poster::after{border-radius:2px;box-shadow:inset 0 0 0 2px var(--accent)}
.grid .poster{box-shadow:0 0 0 1px rgba(128,128,128,.22),0 12px 24px rgba(0,0,0,.32)}
.search-launch{border:0;border-bottom:1px solid var(--line-strong);border-radius:0;background:none;height:56px;padding:0 4px;max-width:560px}
.search-launch:hover{border-color:var(--accent)}
.filters .chips{gap:4px 22px}
.filters .chip{padding:6px 0;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);font-size:14px;background:none}
.filters .chip:hover{border-bottom-color:transparent;color:var(--ink)}
.filters .chip[aria-pressed="true"]{background:none;color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.like[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.btn.primary,.btn-log{border-radius:999px}

@media (min-width:821px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:28px;padding:14px 56px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg)}
  .side .brand{padding:0}
  .nav{order:1;flex-direction:row;gap:26px}
  .nav button{padding:8px 0;border-radius:0;border-bottom:2px solid transparent;gap:8px;background:none}
  .nav button svg{display:none}
  .nav button:hover{background:none;color:var(--ink)}
  .nav button[aria-current="page"]{background:none;color:var(--ink);border-bottom-color:var(--accent)}
  .nav .count{margin-left:2px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px}
  .btn-log{order:2;margin-left:auto;width:auto;padding:10px 20px}
  .btn-log kbd{display:none}
  .side-foot{order:3;margin-top:0;flex-direction:row;align-items:center;gap:2px}
  .foot-btn{padding:10px}
  .foot-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .foot-confirm{flex-direction:row;align-items:center;gap:14px}
  .main{max-width:1440px;margin:0 auto;padding:56px 56px 96px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 18px}
  .page-head h1{font-size:clamp(40px,5vw,64px)}
}

/* News */
.news-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.news-bar p{margin:0}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 24px}
.ncard{display:flex;flex-direction:column;gap:10px;min-width:0;color:inherit;text-decoration:none}
.ncard .nthumb{display:block;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:var(--surface-2);box-shadow:0 0 0 1px rgba(128,128,128,.22)}
.ncard .nthumb img{display:block;width:100%;height:100%;object-fit:cover}
.nofig{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:12px;box-sizing:border-box;text-align:center;color:var(--muted);font:italic 400 22px/1.2 var(--font-d)}
.ncard .nmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.ncard .nmeta b{color:var(--ink);font-weight:600}
.ncard h2{margin:0;font:400 21px/1.22 var(--font-d);letter-spacing:-.01em}
.ncard:hover h2,.ncard:focus-visible h2{text-decoration:underline;text-underline-offset:3px}
.ncard p{margin:0;color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag.hot{background:var(--accent-soft);color:var(--accent)}
@media (min-width:900px){.ncard.lead{grid-column:span 2}.ncard.lead h2{font-size:30px}}

/* ---------- Pure import helpers (CSV, ZIP, matching) ---------- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);

  }

  if(!rows.length)return[];

function parseListCSV(rows,fname){
  let hi=-1;
  for(let i=0;i<rows.length;i++){const c=rows[i].map(x=>x.trim().toLowerCase());if(c.indexOf('name')>-1&&c.indexOf('year')>-1){hi=i;break}}

async function readZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);

  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}

  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);

    if(name.endsWith('/')||!/\.csv$/i.test(name))continue;
    const start=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);

    else if(method===8){
      const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes=new Uint8Array(await new Response(stream).arrayBuffer());

    out.push({name:name,text:dec.decode(bytes),fromZip:true});

function normT(s){return norm(s).replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').trim()}
function chooseMatch(results,name,year){
  const n=normT(name);let best=null,bs=-Infinity;
  for(const r of results){
    const ry=r.release_date?+r.release_date.slice(0,4):0;
    const t1=normT(r.title||''),t2=normT(r.original_title||'');

function posterSVG(f){
  const ck=f.id+'|'+f.title;
  if(posterCache[ck])return posterCache[ck];
  const r=rng(hash(f.title+(f.year||'')));
  const h=Math.floor(r()*360),h2=(h+50+Math.floor(r()*90))%360;
  const bg='hsl('+h+' 20% 10%)',a='hsl('+h2+' 42% 44%)',b='hsl('+h+' 26% 26%)',c='hsl('+h+' 20% 94%)';
  const motif=Math.floor(r()*5);
  let art='';
  if(motif===0){art='<circle cx="'+(70+r()*60).toFixed(1)+'" cy="'+(90+r()*35).toFixed(1)+'" r="'+(48+r()*24).toFixed(1)+'" fill="'+a+'"/><rect y="'+(150+r()*30).toFixed(1)+'" width="200" height="150" fill="'+b+'" opacity=".9"/>'}
  else if(motif===1){for(let i=0;i<7;i++)art+='<rect x="'+(i*29)+'" y="'+(30+r()*130).toFixed(1)+'" width="25" height="300" fill="'+(i%2?a:b)+'"/>'}
  else if(motif===2){const cy=(100+r()*40).toFixed(1);for(let i=4;i>=0;i--)art+='<circle cx="100" cy="'+cy+'" r="'+(18+i*20)+'" fill="none" stroke="'+(i%2?a:b)+'" stroke-width="'+(8+r()*8).toFixed(1)+'"/>'}
  else if(motif===3){const y1=(110+r()*60).toFixed(1),y2=(200+r()*50).toFixed(1);art='<polygon points="0,0 200,0 200,'+y1+' 0,'+y2+'" fill="'+a+'"/><polygon points="0,'+y2+' 200,'+y1+' 200,300 0,300" fill="'+b+'" opacity=".9"/>'}
  else{for(let i=0;i<6;i++)for(let j=0;j<6;j++)art+='<circle cx="'+(20+i*32)+'" cy="'+(34+j*30)+'" r="'+(3+r()*10).toFixed(1)+'" fill="'+((i+j)%2?a:b)+'"/>'}
  const lines=wrapTitle(f.title);
  const maxLen=Math.max.apply(null,lines.map(l=>l.length));
  const size=Math.min(30,Math.floor(172/(maxLen*0.62)));
  const lh=size*1.04,boxH=Math.round(lines.length*lh+46);
  let txt='';
  lines.forEach((l,i)=>{txt+='<text x="16" y="'+(280-(lines.length-1-i)*lh).toFixed(1)+'" font-size="'+size+'" font-weight="700" fill="'+c+'" style="font-family:\'Fraunces\',system-ui,sans-serif;letter-spacing:-0.02em">'+esc(l)+'</text>'});
  const svg='<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="300" fill="'+bg+'"/>'+art+'<rect y="'+(300-boxH)+'" width="200" height="'+boxH+'" fill="'+bg+'" opacity=".78"/>'+txt+(f.year?'<text x="16" y="28" font-size="12" font-weight="600" fill="'+c+'" opacity=".85" style="font-family:\'Hanken Grotesk\',system-ui,sans-serif">'+f.year+'</text>':'')+'</svg>';
  posterCache[ck]=svg;
  return svg;
}
function poster(f,size){
  return f.poster?'<img class="pimg" src="'+IMG+size+f.poster+'" alt="" loading="lazy" decoding="async" data-fid="'+esc(f.id)+'">':posterSVG(f);
}

/* ---------- TMDB client ---------- */
async function tmdb(path,params){
  const key=tmdbKey();
  if(!key)throw new Error('nokey');
  const u=new URL(TMDB+path);
  Object.keys(params||{}).forEach(k=>{const v=params[k];if(v!==undefined&&v!==null&&v!=='')u.searchParams.set(k,v)});
  const opts={headers:{accept:'application/json'}};
  if(key.length>60||key.indexOf('eyJ')===0)opts.headers.Authorization='Bearer '+key;else u.searchParams.set('api_key',key);
  let res=await fetch(u.toString(),opts);
  if(res.status===429){await sleep(1200);res=await fetch(u.toString(),opts)}
  if(res.status===401)throw new Error('badkey');
  if(!res.ok)throw new Error('http '+res.status);
  return res.json();
}
const why=e=>e&&/^http /.test(e.message||'')?' (TMDB answered '+e.message.slice(5)+')':' (the request was blocked or never arrived)';
const errMsg=e=>e&&e.message==='nokey'?'Add your TMDB API key in Settings.':e&&e.message==='badkey'?'TMDB rejected the API key. Check it in Settings.':'Couldn\u2019t reach TMDB'+why(e)+'. Check your connection and try again.';
function toFilm(r){
  const y=r.release_date?+r.release_date.slice(0,4):null;
  return{id:String(r.id),title:r.title||r.original_title||'Untitled',year:y||null,poster:r.poster_path||null,dir:'',runtime:0,genres:(r.genre_ids||[]).map(g=>GENRE[g]).filter(Boolean),blurb:(r.overview||'').slice(0,320)};
}
function remember(f){
  const old=mem[f.id]||S.films[f.id];
  mem[f.id]=old&&old.full?Object.assign({},f,{dir:old.dir,runtime:old.runtime,genres:old.genres.length?old.genres:f.genres,full:true}):f;
  if(S.films[f.id])S.films[f.id]=mem[f.id];
  return mem[f.id];
}
function details(id){
  const cur=film(id);
  if(cur&&cur.full)return Promise.resolve(cur);
  if(inflight[id])return inflight[id];
  inflight[id]=tmdb('/movie/'+id,{append_to_response:'credits',language:'en-US'}).then(d=>{
    const crew=(d.credits&&d.credits.crew)||[];
    const f={id:String(d.id),title:d.title||(cur&&cur.title)||'Untitled',year:d.release_date?+d.release_date.slice(0,4):(cur&&cur.year)||null,poster:d.poster_path||null,
      dir:crew.filter(c=>c.job==='Director').map(c=>c.name).join(', '),runtime:d.runtime||0,
      genres:(d.genres||[]).map(g=>GENRE[g.id]||g.name),blurb:(d.overview||'').slice(0,320),full:true};
    mem[f.id]=f;
    if(S.films[f.id]){S.films[f.id]=f;save()}
    delete inflight[id];return f;
  }).catch(e=>{delete inflight[id];throw e});
  return inflight[id];
}
let hyd={running:false,done:0,total:0};
async function hydrateLogged(){
  if(hyd.running||!tmdbKey())return;
  const ids=[...new Set(S.logs.map(l=>l.filmId).concat(S.watchlist))].filter(id=>S.films[id]&&!S.films[id].full);
  if(!ids.length)return;
  hyd={running:true,done:0,total:ids.length};
  let i=0;
  const worker=async()=>{
    while(i<ids.length){
      const id=ids[i++];
      try{await details(id)}catch(e){if(e.message==='badkey'||e.message==='nokey')i=ids.length}
      hyd.done++;
      if(hyd.done%15===0&&ui.view==='stats')renderMain();
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  hyd.running=false;
  save();
  if(ui.view==='stats'||ui.view==='watchlist')renderMain();
}

function addLog(filmId,rating,opts){
  keep(filmId);
  const l={id:newLogId(),filmId:filmId,date:today(),rating:rating,rewatch:!!(opts&&opts.rewatch),review:''};
  S.logs.push(l);return l;

function setRating(id,v,noToggle){
  const f=film(id),cur=latest(id);
  if(cur&&!noToggle&&cur.rating===v)v=0;
  if(!cur){
    const wasWant=S.watchlist.includes(id);
    mutate('Logged '+f.title+' at '+fmtStars(v)+(wasWant?'. Removed from your watchlist.':''),()=>{addLog(id,v);S.watchlist=S.watchlist.filter(x=>x!==id)});
  }else{
    mutate(v?('Rated '+f.title+' '+fmtStars(v)):('Cleared your rating for '+f.title),()=>{cur.rating=v});
  }
}

/* ---------- Discover (live from TMDB) ---------- */
async function loadDiscover(reset){
  const D=ui.disc;
  if(!tmdbKey())return;
  if(reset){const t=D.tok+1;Object.assign(D,newDisc());D.tok=t}
  else if(D.loading)return;
  const tok=D.tok;
  D.loading=true;D.error=null;
  if(ui.view==='discover')renderMain();
  try{
    const fl=ui.filters,p={page:D.page+1,include_adult:false,language:'en-US'};
    let gte='',lte='';
    if(fl.decade!=='Any'){const y=parseInt(fl.decade,10);gte=y+'-01-01';lte=(y+9)+'-12-31'}
    if(fl.sort==='top'){p.sort_by='vote_average.desc';p['vote_count.gte']=500}
    else if(fl.sort==='new'){p.sort_by='primary_release_date.desc';p['vote_count.gte']=50;const t=today();if(!lte||lte>t)lte=t}
    else{p.sort_by='popularity.desc';p['vote_count.gte']=100}
    if(gte)p['primary_release_date.gte']=gte;
    if(lte)p['primary_release_date.lte']=lte;
    if(fl.genre!=='All')p.with_genres=GENRE_ID[fl.genre];
    if(fl.length==='short')p['with_runtime.lte']=99;
    else if(fl.length==='mid'){p['with_runtime.gte']=100;p['with_runtime.lte']=130}
    else if(fl.length==='long')p['with_runtime.gte']=131;
    const r=await tmdb('/discover/movie',p);
    if(tok!==D.tok)return;
    (r.results||[]).forEach(x=>{const f=remember(toFilm(x));if(D.items.indexOf(f.id)<0)D.items.push(f.id)});
    D.page=r.page;D.total=Math.min(r.total_pages||1,50);
  }catch(e){
    if(tok!==D.tok)return;
    D.error=errMsg(e);
  }
  D.loading=false;
  if(ui.view==='discover')renderMain();
}

function tally(arr){const m={};arr.forEach(x=>{m[x]=(m[x]||0)+1});return Object.keys(m).map(k=>[k,m[k]]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}
function bars(entries){
  if(!entries.length)return '<p class="note">Nothing to show yet.</p>';
  const max=entries[0][1];
  return entries.map(e=>'<div class="bar"><span class="lbl" title="'+esc(e[0])+'">'+esc(e[0])+'</span><span class="track"><i style="width:'+(e[1]/max*100)+'%"></i></span><span class="n">'+e[1]+'</span></div>').join('');

function viewStats(){
  const head='<header class="page-head"><h1>Your stats</h1></header>';
  const logs=S.logs.filter(l=>film(l.filmId));
  if(!logs.length)return head+emptyBlock('Stats appear once you log a few films','Rate your first film and the numbers start filling in.','Log a film','palette');
  const films=new Set(logs.map(l=>l.filmId));
  const known=logs.filter(l=>film(l.filmId).runtime>0);
  const mins=known.reduce((a,l)=>a+film(l.filmId).runtime,0);
  const rated=logs.filter(l=>l.rating>0);
  const avg=rated.length?rated.reduce((a,l)=>a+l.rating,0)/rated.length:null;
  const hrs=mins/60;
  const big=(n,l)=>'<div class="big"><b>'+n+'</b><span>'+l+'</span></div>';
  const vals=[.5,1,1.5,2,2.5,3,3.5,4,4.5,5];
  const counts=vals.map(v=>rated.filter(l=>l.rating===v).length);
  const mx=Math.max.apply(null,counts.concat([1]));
  const dist='<div class="dist" role="img" aria-label="Number of viewings at each rating">'+vals.map((v,i)=>'<div class="col"><span class="n">'+(counts[i]||'')+'</span><i style="height:'+(counts[i]/mx*100)+'%"></i><span class="x">'+v+'</span></div>').join('')+'</div>';
  const dirs=[];logs.forEach(l=>{const d=film(l.filmId).dir;if(d)d.split(', ').forEach(x=>dirs.push(x))});
  const note=hyd.running?'<p class="sub" role="status" style="margin-bottom:16px">Filling in runtimes and directors ('+hyd.done+' of '+hyd.total+')\u2026</p>':(known.length<logs.length?'<p class="sub" style="margin-bottom:16px">Hours cover films with a known runtime.</p>':'');
  return head+note
    +'<div class="bigs">'+big(films.size.toLocaleString('en-US'),films.size===1?'Film watched':'Films watched')+big(hrs>=10?Math.round(hrs).toLocaleString('en-US'):hrs.toFixed(1),'Hours watched')+big(avg===null?'None':avg.toFixed(1),'Average rating')+big(logs.filter(l=>l.rewatch).length.toLocaleString('en-US'),'Rewatches')+'</div>'
    +'<div class="panels">'
    +'<section class="panel"><h2>How you rate</h2>'+(rated.length?dist:'<p class="note">Rate a film to see this chart.</p>')+'</section>'
    +'<section class="panel"><h2>Top genres</h2>'+bars(tally(logs.reduce((a,l)=>a.concat(film(l.filmId).genres),[])).slice(0,6))+'</section>'
    +'<section class="panel"><h2>By decade</h2>'+bars(tally(logs.map(l=>decadeOf(film(l.filmId))).filter(d=>d!=='Unknown')).sort((a,b)=>a[0].localeCompare(b[0])))+'</section>'
    +'<section class="panel"><h2>Most watched directors</h2>'+bars(tally(dirs).slice(0,5))+'</section>'
    +'</div>';
}

/* ---------- Letterboxd import ---------- */
function setProgress(done,total,label){
  const p=ui.imp.progress;p.done=done;p.total=total;p.label=label;
  const bar=$('#impBar'),txt=$('#impText');
  if(bar)bar.style.width=(total?Math.round(done/total*100):0)+'%';
  if(txt)txt.textContent=label;
}
async function readImportFiles(fileList){
  const imp=ui.imp;
  imp.msg='';imp.phase='reading';renderMain();
  try{
    const entries=[];
    for(const file of Array.from(fileList)){
      if(/\.zip$/i.test(file.name)){
        let z;
        try{z=await readZip(await file.arrayBuffer())}catch(e){throw new Error('zip')}
        z.forEach(x=>entries.push(x));
      }else if(/\.csv$/i.test(file.name)){
        entries.push({name:file.name,text:await file.text(),fromZip:false});
      }
    }
    const known={'diary.csv':'diary','ratings.csv':'ratings','watched.csv':'watched','watchlist.csv':'watchlist','reviews.csv':'reviews'};
    const data={diary:[],ratings:[],watched:[],watchlist:[],reviews:[],lists:[]};
    entries.forEach(e=>{
      const path=e.name.replace(/\\/g,'/').toLowerCase(),base=path.split('/').pop();
      if(/(^|\/)(deleted|orphaned|likes)\//.test(path))return;
      const rows=parseCSV(e.text);
      if(!rows.length)return;
      const inLists=/(^|\/)lists\//.test(path);
      if(inLists||(!e.fromZip&&!known[base])){
        const L=parseListCSV(rows,e.name);
        if(L&&L.rows.length)data.lists.push(L);
        return;
      }
      if(known[base]){
        const objs=toObjects(rows).filter(r=>r.name);
        data[known[base]]=data[known[base]].concat(objs);
      }
    });
    const total=Object.keys(data).reduce((a,k)=>a+data[k].length,0);
    if(!total){imp.phase='idle';imp.msg='We couldn\u2019t find Letterboxd data in those files. Choose the ZIP you downloaded from Letterboxd, or CSV files like diary.csv.';renderMain();return}
    imp.data=data;
    imp.opts={diary:true,watched:true,watchlist:true,lists:true};
    imp.phase='ready';
  }catch(e){
    imp.phase='idle';
    imp.msg=e&&e.message==='zip'?'We couldn\u2019t read that ZIP file. Try choosing the CSV files from inside it instead.':'Something went wrong reading those files.';
  }
  renderMain();
}
async function pool(items,n,fn){
  let i=0;
  const w=async()=>{while(i<items.length){const it=items[i++];await fn(it)}};
  await Promise.all(Array.from({length:n},w));
}
async function searchTry(params){
  for(let a=0;a<2;a++){
    try{return await tmdb('/search/movie',params)}
    catch(e){if(e.message==='badkey'||e.message==='nokey'||a===1)throw e;await sleep(700)}
  }
}
async function resolveFilm(name,year){
  const key=name+'|'+year;
  let r=null;
  if(year){const a=await searchTry({query:name,primary_release_year:year,include_adult:false,language:'en-US'});r=chooseMatch(a.results||[],name,year)}
  if(!r){const b=await searchTry({query:name,include_adult:false,language:'en-US'});r=chooseMatch(b.results||[],name,year)}
  if(r){const f=remember(toFilm(r));S.films[f.id]=f;S.resolve[key]=f.id}else S.resolve[key]=0;
}
async function runImport(){
  const imp=ui.imp,d=imp.data,o=imp.opts;
  if(!tmdbKey()){renderMain();return}
  const need=new Map();
  const add=r=>{const nm=r.name;if(!nm)return;const yr=+r.year||0;const k=nm+'|'+yr;if(!need.has(k))need.set(k,{name:nm,year:yr})};
  if(o.diary){d.diary.forEach(add);d.reviews.forEach(add)}
  if(o.diary||o.watched)d.ratings.forEach(add);
  if(o.watched)d.watched.forEach(add);
  if(o.watchlist)d.watchlist.forEach(add);
  if(o.lists)d.lists.forEach(L=>L.rows.forEach(add));
  const todo=[...need.entries()].filter(e=>{const c=S.resolve[e[0]];return c===undefined||(c&&!S.films[c])});
  imp.phase='running';setProgress(0,todo.length,'Starting\u2026');renderMain();
  const failed=new Map();let abort=null,done=0;
  await pool(todo,6,async e=>{
    if(abort)return;
    try{await resolveFilm(e[1].name,e[1].year)}
    catch(err){
      if(err.message==='badkey'||err.message==='nokey')abort=err.message;
      else failed.set(e[0],e[1].name+(e[1].year?' ('+e[1].year+')':''));
    }
    done++;
    setProgress(done,todo.length,'Matched '+done.toLocaleString('en-US')+' of '+todo.length.toLocaleString('en-US')+' films');
    if(done%25===0)save();
  });
  save();
  if(abort){imp.phase='idle';imp.msg=errMsg({message:abort});renderMain();return}

  const snap=JSON.stringify({logs:S.logs,watchlist:S.watchlist,lists:S.lists,nextId:S.nextId});
  const stat={logs:0,watchedOnly:0,watchlist:0,lists:0,listFilms:0,unmatched:new Map(),failed:new Map()};
  const kf=r=>r.name+'|'+(+r.year||0);
  const idOf=r=>{const v=S.resolve[kf(r)];return v&&S.films[v]?String(v):null};
  const miss=r=>{const k=kf(r),label=r.name+(+r.year?' ('+(+r.year)+')':'');if(failed.has(k))stat.failed.set(k,label);else stat.unmatched.set(k,label)};
  const dateOf=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s:today();
  const rateOf=s=>{const v=parseFloat(s);return v>=0.5&&v<=5?Math.round(v*2)/2:0};
  const isYes=s=>/^yes$/i.test(s||'');
  const ratingMap={};
  if(o.diary||o.watched)d.ratings.forEach(r=>{const id=idOf(r);if(id)ratingMap[id]=rateOf(r.rating)});

  if(o.diary){
    d.diary.forEach(r=>{
      const id=idOf(r);if(!id){miss(r);return}
      const date=dateOf(r['watched date']||r.date),rating=rateOf(r.rating);
      if(S.logs.some(l=>l.filmId===id&&l.date===date&&l.rating===rating))return;
      S.logs.push({id:newLogId(),filmId:id,date:date,rating:rating,rewatch:isYes(r.rewatch),review:''});stat.logs++;
    });
    d.reviews.forEach(r=>{
      const id=idOf(r);if(!id){miss(r);return}
      const text=cleanReview(r.review);if(!text)return;
      const wd=r['watched date']||'';
      const all=S.logs.filter(l=>l.filmId===id).sort(cmpLogDesc);
      let l=wd?all.find(x=>x.date===wd):all[0];
      if(!l){l={id:newLogId(),filmId:id,date:dateOf(wd||r.date),rating:rateOf(r.rating),rewatch:isYes(r.rewatch),review:''};S.logs.push(l);stat.logs++}
      if(!l.review)l.review=text.slice(0,2000);
    });
  }
  if(o.diary||o.watched){
    Object.keys(ratingMap).forEach(fid=>{
      if(!ratingMap[fid])return;
      const ls=S.logs.filter(l=>l.filmId===fid).sort(cmpLogDesc);
      if(ls.length&&!ls[0].rating)ls[0].rating=ratingMap[fid];
    });
  }
  if(o.watched){
    d.watched.forEach(r=>{
      const id=idOf(r);if(!id){miss(r);return}
      if(S.logs.some(l=>l.filmId===id))return;
      S.logs.push({id:newLogId(),filmId:id,date:dateOf(r.date),rating:ratingMap[id]||0,rewatch:false,review:''});stat.logs++;stat.watchedOnly++;
    });
  }
  if(o.watchlist){
    d.watchlist.forEach(r=>{
      const id=idOf(r);if(!id){miss(r);return}
      if(seen(id)||S.watchlist.indexOf(id)>-1)return;
      S.watchlist.push(id);stat.watchlist++;
    });
  }
  if(o.lists){
    d.lists.forEach(L=>{
      const ids=[];
      L.rows.forEach(r=>{const id=idOf(r);if(!id){miss(r);return}if(ids.indexOf(id)<0)ids.push(id)});
      let t=S.lists.find(x=>x.name.toLowerCase()===L.name.toLowerCase());
      if(!t){t={id:'l'+(S.nextId++),name:L.name,films:[]};S.lists.push(t)}
      let added=0;ids.forEach(id=>{if(t.films.indexOf(id)<0){t.films.push(id);added++}});
      stat.lists++;stat.listFilms+=added;
    });
  }
  save();
  imp.result=stat;imp.snap=snap;imp.phase='done';
  renderAll();
  hydrateLogged();
}

function bindRate(el,id){
  const ov=el.querySelector('.stars>span'),val=drawer.querySelector('.rate-val'),cur=ratingOf(id);
  const show=v=>{ov.style.width=(v/5*100)+'%';val.textContent=v?v.toFixed(1):'Not rated'};
  const fromX=x=>{const r=el.getBoundingClientRect();return Math.min(5,Math.max(.5,Math.ceil(((x-r.left)/r.width)*10)/2))};
  el.addEventListener('mousemove',e=>show(fromX(e.clientX)));
  el.addEventListener('mouseleave',()=>show(cur));
  el.addEventListener('click',e=>{ui.refocusRate=true;setRating(id,fromX(e.clientX))});
  el.addEventListener('keydown',e=>{
    const c=ratingOf(id);let n=null;
    if(e.key==='ArrowRight'||e.key==='ArrowUp')n=Math.min(5,c+.5);
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown')n=Math.max(0,c-.5);
    else if(/^[1-5]$/.test(e.key))n=+e.key;
    else if(e.key==='0'||e.key==='Backspace'||e.key==='Delete')n=0;
    if(n===null)return;
    e.preventDefault();
    if(n===c)return;
    if(n===0&&!latest(id))return;
    setRating(id,n,true);
  });
}

/* ---------- Palette (quick log, live TMDB search) ---------- */
function runSearch(){
  const raw=pInput.value.trim();
  if(!raw){pTok++;pState={q:'',items:[],loading:false,error:null};renderPalette();return}
  if(!tmdbKey()){pState={q:raw,items:[],loading:false,error:'nokey'};renderPalette();return}
  let q=raw,year='';
  const m=raw.match(/^(.*\S)\s+((?:19|20)\d\d)$/);
  if(m){q=m[1];year=m[2]}
  const tok=++pTok;
  pState.loading=true;pState.q=raw;renderPalette();
  tmdb('/search/movie',{query:q,year:year,include_adult:false,language:'en-US',page:1}).then(r=>{
    if(tok!==pTok)return;
    const items=(r.results||[]).slice(0,8).map(x=>remember(toFilm(x)));
    pState={q:raw,items:items.map(f=>f.id),loading:false,error:null};
    pIndex=0;renderPalette();
  }).catch(e=>{
    if(tok!==pTok)return;
    pState={q:raw,items:[],loading:false,error:e.message};renderPalette();
  });
}
function renderPalette(){
  const raw=pInput.value.trim();
  let head='',items=[],body='';
  if(!raw){
    items=S.watchlist.map(film).filter(Boolean).slice(0,6);
    head=items.length?'On your watchlist':'Start typing a film title. Add a year to narrow it down.';
  }else{
    items=pState.items.map(film).filter(Boolean);
    if(pState.error)body='<li class="p-empty" role="presentation">'+esc(errMsg({message:pState.error}))+((pState.error==='nokey'||pState.error==='badkey')?' <button class="link" data-act="goto-settings">Open Settings</button>':'')+'</li>';
    else if(pState.loading&&!items.length)body='<li class="p-empty" role="presentation">Searching\u2026</li>';
    else if(!items.length&&pState.q===raw)body='<li class="p-empty" role="presentation">No match for \u201c'+esc(raw)+'\u201d. Check the spelling or try fewer words.</li>';
  }
  pItems=items.map(f=>f.id);
  if(pIndex>=pItems.length)pIndex=Math.max(0,pItems.length-1);
  let h='';
  if(head)h+='<li class="p-head" role="presentation">'+head+'</li>';
  h+=body;
  items.forEach((f,i)=>{
    const s=seen(f.id),w=S.watchlist.includes(f.id),r=ratingOf(f.id);
    h+='<li class="p-item" role="option" id="p-'+esc(f.id)+'" data-act="pick" data-id="'+esc(f.id)+'" aria-selected="'+(i===pIndex)+'"><span class="poster">'+poster(f,'w154')+'</span>'
      +'<span class="info"><span class="t">'+esc(f.title)+'</span><span class="sub muted">'+(f.year||'Year unknown')+'</span></span>'
      +'<span class="st">'+(s?icoCheck.replace('width="20" height="20"','width="14" height="14"')+(r?stars(r):'Watched'):w?'On watchlist':'')+'</span></li>';
  });
  pList.innerHTML=h;
  if(pItems.length)pInput.setAttribute('aria-activedescendant','p-'+pItems[pIndex]);else pInput.removeAttribute('aria-activedescendant');
  const sel=$('[aria-selected="true"]',pList);if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function openPalette(){
  lastFocusP=document.activeElement;
  palette.hidden=false;app.inert=true;
  pInput.value='';pIndex=0;pState={q:'',items:[],loading:false,error:null};renderPalette();pInput.focus();
}
function closePalette(){
  palette.hidden=true;
  if(!drawer.classList.contains('open'))app.inert=false;
  const f=lastFocusP;lastFocusP=null;
  if(f&&document.contains(f)&&!f.closest('[inert]'))f.focus({preventScroll:true});
  else if(drawer.classList.contains('open')){const t=$('.rate',drawer);if(t)t.focus({preventScroll:true})}
}
pInput.addEventListener('input',()=>{
  pIndex=0;clearTimeout(pTimer);
  if(!pInput.value.trim()){runSearch();return}
  pTimer=setTimeout(runSearch,220);
});
pInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(pItems.length){pIndex=(pIndex+1)%pItems.length;renderPalette()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(pItems.length){pIndex=(pIndex-1+pItems.length)%pItems.length;renderPalette()}}
  else if(e.key==='Enter'){e.preventDefault();const id=pItems[pIndex];if(id){closePalette();openFilm(id,true)}}

const SB_URL_KEY='stub_sb_url',SB_ANON_KEY='stub_sb_anon',SB_SESSION_KEY='stub_sb_session',SB_PENDING_KEY='stub_sb_pending';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const sbFixed=()=>!!(SUPABASE_URL&&SUPABASE_URL.indexOf('PASTE')!==0&&SUPABASE_ANON_KEY&&SUPABASE_ANON_KEY.indexOf('PASTE')!==0);

  if(sbFixed())return{url:SUPABASE_URL.replace(/\/+$/,''),anon:SUPABASE_ANON_KEY};
  const u=lsGet(SB_URL_KEY),a=lsGet(SB_ANON_KEY);
  return u&&a?{url:u.replace(/\/+$/,''),anon:a}:null;
}
let sess=null;
try{sess=JSON.parse(lsGet(SB_SESSION_KEY)||'null')}catch(e){sess=null}
let me=null;
const signedIn=()=>!!(sess&&sess.user&&sess.user.id);

/* ---------- Low-level REST ---------- */
function sbErr(code,msg,status){const e=new Error(msg||code);e.code=code;e.status=status;return e}
function friendly(e){
  if(!e)return 'Something went wrong.';
  if(e.code==='network')return 'Couldn\u2019t reach the server. Check your connection.';
  if(e.code==='session')return 'You\u2019ve been signed out. Sign in again.';
  if(e.code==='nobackend')return 'Social features aren\u2019t set up yet.';
  if(e.code==='42P01'||e.code==='PGRST205'||e.code==='PGRST202'||e.code==='42883')return 'The database isn\u2019t set up yet. Run stub-schema.sql in your Supabase SQL editor.';
  return e.message||'Something went wrong.';
}
let refreshing=null;
function setSession(j){
  if(!j||!j.access_token)return false;
  const prev=sess&&sess.user?sess.user:{};
  sess={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),
    user:{id:(j.user&&j.user.id)||prev.id,email:(j.user&&j.user.email)||prev.email}};
  lsSet(SB_SESSION_KEY,JSON.stringify(sess));
  return true;
}
function refreshSession(){
  if(refreshing)return refreshing;
  const cfg=sbConfig();
  if(!cfg||!sess||!sess.refresh_token)return Promise.resolve(false);
  refreshing=(async()=>{
    try{
      const res=await fetch(cfg.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.anon,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh_token})});
      if(!res.ok)return false;
      return setSession(await res.json());
    }catch(e){return false}
    finally{refreshing=null}
  })();
  return refreshing;
}
async function sbFetch(path,opts){
  opts=opts||{};
  const cfg=sbConfig();
  if(!cfg)throw sbErr('nobackend');
  const authed=opts.auth!==false;
  if(authed&&sess&&sess.expires_at-60<Date.now()/1000)await refreshSession();
  const headers=Object.assign({apikey:cfg.anon,'Content-Type':'application/json'},opts.headers||{});
  headers.Authorization='Bearer '+(authed&&sess?sess.access_token:cfg.anon);
  let res;
  try{res=await fetch(cfg.url+path,{method:opts.method||'GET',headers:headers,body:opts.body!==undefined?JSON.stringify(opts.body):undefined})}
  catch(e){throw sbErr('network')}
  if(res.status===401&&authed&&sess&&!opts.retried){
    if(await refreshSession())return sbFetch(path,Object.assign({},opts,{retried:true}));
    sbSignOutLocal();
    throw sbErr('session');
  }
  return res;
}
async function sbJson(res){
  let body=null;
  const txt=await res.text();
  if(txt){try{body=JSON.parse(txt)}catch(e){body=null}}
  if(!res.ok){
    const m=(body&&(body.message||body.msg||body.error_description||body.error))||('Request failed ('+res.status+')');
    throw sbErr((body&&(body.code||body.error_code))||('http'+res.status),m,res.status);
  }
  return body;
}
const rest=(path,opts)=>sbFetch('/rest/v1/'+path,opts).then(sbJson);
const rpc=(name,args)=>rest('rpc/'+name,{method:'POST',body:args||{}});
async function sbFetchAll(path){
  const out=[],size=1000;
  let from=0;
  for(;;){
    const res=await sbFetch('/rest/v1/'+path,{headers:{'Range-Unit':'items',Range:from+'-'+(from+size-1)}});
    const rows=(await sbJson(res))||[];
    out.push.apply(out,rows);
    if(rows.length<size)break;
    from+=size;
  }
  return out;
}

/* ---------- Accounts ---------- */
async function sbSignUp(email,password){
  const j=await sbJson(await sbFetch('/auth/v1/signup',{method:'POST',auth:false,body:{email:email,password:password}}));
  if(j&&j.access_token){setSession(j);return 'signedin'}
  return 'confirm';
}
async function sbSignIn(email,password){
  const j=await sbJson(await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:email,password:password}}));
  if(!setSession(j))throw sbErr('nosession','Sign in failed.');
}

/* ---------- Sync (diary mirrors to your account) ---------- */
const logSig=l=>JSON.stringify([l.filmId,l.date,l.rating||0,!!l.rewatch,l.review||'']);
function logRow(l){
  const f=S.films[l.filmId]||{};
  return{user_id:sess.user.id,id:l.id,film_id:l.filmId,title:f.title||'Untitled',year:f.year||null,poster:f.poster||null,genres:f.genres||[],date:l.date,rating:l.rating||0,rewatch:!!l.rewatch,review:l.review||''};
}
function queueSync(){
  if(!signedIn()||!me||soc.mergeChoice)return;
  clearTimeout(soc.syncT);
  soc.syncT=setTimeout(syncNow,1800);
}
async function syncNow(){
  if(!signedIn()||!me||soc.mergeChoice)return;
  if(soc.syncBusy){soc.syncAgain=true;return}
  clearTimeout(soc.syncT);
  soc.syncBusy=true;soc.syncError=null;
  try{
    const uid=sess.user.id;
    if(!S.synced)S.synced={};
    const ids=new Set(S.logs.map(l=>l.id));
    const dirty=S.logs.filter(l=>S.films[l.filmId]&&S.synced[l.id]!==logSig(l));
    for(let i=0;i<dirty.length;i+=200){
      const batch=dirty.slice(i,i+200),sigs=batch.map(logSig);
      await rest('logs?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:batch.map(logRow)});
      batch.forEach((l,k)=>{S.synced[l.id]=sigs[k]});
    }
    const gone=Object.keys(S.synced).filter(id=>!ids.has(id));
    for(let i=0;i<gone.length;i+=100){
      const batch=gone.slice(i,i+100);
      await rest('logs?user_id=eq.'+uid+'&id=in.('+batch.join(',')+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});
      batch.forEach(id=>{delete S.synced[id]});
    }
    persist();

    const rows=await sbFetchAll('logs?user_id=eq.'+uid+'&select=id,film_id,title,year,poster,genres,date,rating,rewatch,review&order=date.desc,created_at.desc');
    let changed=false;
    const byId={};S.logs.forEach(l=>{byId[l.id]=l});
    rows.forEach(c=>{
      const incoming={id:c.id,filmId:c.film_id,date:c.date,rating:Number(c.rating)||0,rewatch:!!c.rewatch,review:c.review||''};
      const cs=logSig(incoming),l=byId[c.id];
      if(!S.films[c.film_id]){
        S.films[c.film_id]={id:c.film_id,title:c.title,year:c.year,poster:c.poster,dir:'',runtime:0,genres:c.genres||[],blurb:''};
        changed=true;
      }
      if(!l){
        if(S.synced[c.id]===undefined){S.logs.push(incoming);S.synced[c.id]=cs;changed=true}
      }else{
        const ls=logSig(l);
        if(ls===cs)S.synced[c.id]=cs;
        else if(S.synced[c.id]===ls){Object.assign(l,incoming);S.synced[c.id]=cs;changed=true}
      }
    });
    persist();
    soc.last=Date.now();
    if(changed){renderAll();hydrateLogged()}
  }catch(e){
    soc.syncError=friendly(e);
  }
  soc.syncBusy=false;
  if(soc.syncAgain){soc.syncAgain=false;queueSync()}
  if(ui.view==='settings')renderMain();
}

async function loadFollowList(kind){

  L.loading=true;L.error=null;renderSoc();
  try{
    const rows=await rpc('follow_list',{p_user:me.id,p_kind:kind});
    L[kind]=rows||[];
    L[kind].forEach(r=>{soc.iFollow[r.id]=!!r.i_follow});
  }catch(e){L.error=friendly(e)}
  L.loading=false;renderSoc();
}
async function loadProfile(username){
  const P=soc.profile;
  Object.assign(P,{username:username,user:null,stats:null,items:[],loading:true,error:null,notFound:false,done:false});
  renderSoc();
  try{
    const r=await rest('profiles?username=eq.'+encodeURIComponent(String(username).toLowerCase())+'&select=id,username,display_name,bio,visibility,created_at');
    if(P.username!==username)return;
    if(!r||!r[0]){P.notFound=true;P.loading=false;renderSoc();return}
    P.user=r[0];
    const res=await Promise.all([rpc('profile_stats',{p_user:P.user.id}),rpc('user_diary',{p_user:P.user.id,p_limit:30,p_offset:0})]);
    if(P.username!==username)return;
    P.stats=Array.isArray(res[0])?res[0][0]:res[0];
    soc.iFollow[P.user.id]=!!(P.stats&&P.stats.i_follow);
    P.items=(res[1]||[]).map(normPost);
    P.done=(res[1]||[]).length<30;
  }catch(e){if(P.username===username)P.error=friendly(e)}
  if(P.username===username){P.loading=false;renderSoc()}
}
async function loadMoreProfile(){
  const P=soc.profile;
  if(!P.user||P.loading||P.done)return;
  P.loading=true;renderSoc();
  try{
    const rows=await rpc('user_diary',{p_user:P.user.id,p_limit:30,p_offset:P.items.length});
    (rows||[]).forEach(r=>P.items.push(normPost(r)));
    if(!rows||rows.length<30)P.done=true;
  }catch(e){toast(friendly(e))}
  P.loading=false;renderSoc();
}
function loadFriendsFor(id){
  if(!signedIn()||!me||soc.friendsFor[id]!==undefined)return;
  rpc('film_friends',{p_film:String(id)}).then(rows=>{
    const seenU={},out=[];
    (rows||[]).forEach(r=>{if(!seenU[r.user_id]){seenU[r.user_id]=1;out.push(r)}});
    soc.friendsFor[id]=out;
    if(ui.film===id)renderDrawer();
  }).catch(()=>{soc.friendsFor[id]='error';if(ui.film===id)renderDrawer()});
}
async function toggleLike(uid,lid){
  if(!me)return;
  const targets=[];
  [soc.feed.items,soc.profile.items].forEach(a=>a.forEach(p=>{if(p.uid===uid&&p.lid===lid)targets.push(p)}));
  if(!targets.length)return;
  const was=targets[0].liked;
  const set=v=>targets.forEach(p=>{p.liked=v;p.likes=Math.max(0,p.likes+(v?1:-1))});
  set(!was);renderSoc();
  try{
    if(was)await rest('likes?user_id=eq.'+me.id+'&log_user_id=eq.'+uid+'&log_id=eq.'+encodeURIComponent(lid),{method:'DELETE',headers:{Prefer:'return=minimal'}});
    else await rest('likes',{method:'POST',headers:{Prefer:'return=minimal'},body:{user_id:me.id,log_user_id:uid,log_id:lid}});
  }catch(e){
    if(!was&&e.code==='23505')return;
    set(was);renderSoc();toast(friendly(e));
  }
}
async function toggleFollow(uid){
  if(!me||uid===me.id)return;
  const was=!!soc.iFollow[uid];
  const bump=d=>{const s=soc.profile.stats;if(s&&soc.profile.user&&soc.profile.user.id===uid)s.followers=Math.max(0,Number(s.followers)+d)};
  soc.iFollow[uid]=!was;bump(was?-1:1);
  soc.feed.loaded=false;soc.friendsFor={};
  renderSoc();
  try{
    if(was)await rest('follows?follower_id=eq.'+me.id+'&followee_id=eq.'+uid,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    else await rest('follows',{method:'POST',headers:{Prefer:'return=minimal'},body:{follower_id:me.id,followee_id:uid}});
  }catch(e){
    if(!was&&e.code==='23505')return;
    soc.iFollow[uid]=was;bump(was?1:-1);renderSoc();toast(friendly(e));
  }
}
function enterFriends(){
  if(!signedIn()||!me)return;
  if(soc.tab==='activity'&&!soc.feed.loaded)loadFeed(false);
  else if(soc.tab==='people'&&!soc.people.loaded)runPeople();
  else if(soc.tab==='following'||soc.tab==='followers')loadFollowList(soc.tab);
}

/* ---------- Social actions (called from the click handler) ---------- */
async function acctSubmit(){
  const A=soc.acct,email=($('#acEmail')||{}).value||'',pass=($('#acPass')||{}).value||'';
  const up=A.mode==='signup',uname=up?(($('#acUser')||{}).value||'').trim().toLowerCase():'',vis=up?(($('#acVis')||{}).value||'public'):'public';
  A.err='';
  if(!email.trim()||!pass){A.err='Enter your email and password.';renderMain();return}
  if(up){
    if(!/^[a-z0-9_]{3,20}$/.test(uname)){A.err='Usernames are 3 to 20 characters: lowercase letters, numbers, and underscores.';renderMain();return}
    if(pass.length<6){A.err='Use a password with at least 6 characters.';renderMain();return}
  }
  A.busy=true;renderMain();
  try{
    if(up){
      lsSet(SB_PENDING_KEY,JSON.stringify({username:uname,visibility:vis}));
      const r=await sbSignUp(email.trim(),pass);
      if(r==='confirm'){A.confirm=true;A.busy=false;renderMain();return}
    }else{
      await sbSignIn(email.trim(),pass);
    }
    A.busy=false;
    await afterSignIn();
    toast(me?'Signed in as @'+me.username:'Signed in');
  }catch(e){
    A.busy=false;
    A.err=e.code==='taken'?e.message:(e.status===400||e.status===422||e.status===401)?(up?e.message:'That email and password didn\u2019t match.'):friendly(e);
    if(up)lsDel(SB_PENDING_KEY);
    renderMain();
  }
}

async function saveBackend(){
  const url=(($('#sbUrl')||{}).value||'').trim().replace(/\/+$/,''),anon=(($('#sbAnon')||{}).value||'').trim()||lsGet(SB_ANON_KEY)||'';
  if(!/^https:\/\/.+/.test(url)||!anon){soc.sbMsg='Enter the project URL (starting with https://) and the anon key.';renderMain();return}
  soc.sbMsg='Checking\u2026';renderMain();
  try{

/* =====================================================================
   NEWS: headlines from film publications (RSS via rss2json)
   ===================================================================== */
const NEWS_KEY='stub_news_v1';
const news={items:[],at:0,loading:false,error:null,failed:[],loaded:false,src:'All',topic:'All',watch:false};
const NEWS_TOPICS=[
  ['Casting',/\b(cast|casts|casting|joins|joining|to star|stars in|lead role|tapped|boards|in talks|returns? as|replaces)\b/i],
  ['Trailers',/\b(trailer|teaser|first look|first-look|clip|sneak peek|poster|featurette)\b/i],
  ['Release dates',/\b(release date|dated|sets? release|premiere date|opens? in theaters|theatrical release|streaming date|moves? to|delayed|pushed)\b/i],
  ['In production',/\b(production|filming|shoot|shooting|wraps?|greenlit?|sequel|prequel|remake|reboot|adaptation|spinoff|spin-off|in development|to direct|set to write)\b/i],
  ['Box office',/\b(box office|opening weekend|grosses|opens? to \$|tops the)\b/i],
  ['Awards and festivals',/\b(oscar|oscars|academy award|emmy|golden globe|bafta|festival|cannes|venice|sundance|tiff|toronto film|award|awards|nominat)/i]
];
function decodeEnt(s){
  const named={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' ',hellip:'\u2026',mdash:'\u2014',ndash:'\u2013',lsquo:'\u2018',rsquo:'\u2019',ldquo:'\u201C',rdquo:'\u201D'};
  return String(s).replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi,(m,g)=>{
    if(g[0]==='#'){const n=(g[1]==='x'||g[1]==='X')?parseInt(g.slice(2),16):parseInt(g.slice(1),10);return n>0&&n<0x110000?String.fromCodePoint(n):m}
    const v=named[g.toLowerCase()];return v===undefined?m:v;
  });
}
function clip(s,n){
  s=String(s).trim();if(s.length<=n)return s;
  const c=s.slice(0,n),i=c.lastIndexOf(' ');
  return (i>n*0.6?c.slice(0,i):c).replace(/[\s,;:.\-\u2013\u2014]+$/,'')+'\u2026';
}
function newsText(html){
  let t=String(html||'').replace(/<[^>]*>/g,' ');
  t=decodeEnt(t).replace(/\s+/g,' ').trim();
  t=t.replace(/\s*The post .{0,300}? appeared first on .*$/i,'').replace(/\s*\[\u2026\]\s*$|\s*\[\.\.\.\]\s*$/,'').trim();
  return t;
}
function parseNewsItem(src,it){
  if(!it||typeof it!=='object')return null;
  const link=String(it.link||it.guid||'').trim();
  if(!/^https?:\/\//i.test(link))return null;
  const title=decodeEnt(String(it.title||'').replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim();
  if(!title)return null;
  const pd=String(it.pubDate||'').trim();
  let ts=/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(pd)?Date.parse(pd.replace(' ','T')+'Z'):Date.parse(pd);
  if(isNaN(ts))ts=0;
  let thumb=String(it.thumbnail||'').trim();
  if(!thumb&&it.enclosure&&it.enclosure.link&&/image/i.test(String(it.enclosure.type||'image')))thumb=String(it.enclosure.link);
  if(!thumb){const m=String(it.content||it.description||'').match(/<img[^>]+src=["']([^"']+)["']/i);if(m)thumb=m[1];}
  thumb=/^https:\/\//i.test(thumb)?thumb:'';
  const excerpt=clip(newsText(it.description||it.content),200);
  const hay=title+' '+excerpt;
  const topics=NEWS_TOPICS.filter(t=>t[1].test(hay)).map(t=>t[0]);
  return{id:link,source:src.name,sid:src.id,title:title,link:link,ts:ts,thumb:thumb,excerpt:excerpt===title?'':excerpt,topics:topics};
}
async function fetchFeed(src){
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort()},12000);
  try{
    let u=RSS2JSON_URL+'?rss_url='+encodeURIComponent(src.url);
    if(RSS2JSON_KEY&&RSS2JSON_KEY.indexOf('PASTE')!==0)u+='&api_key='+encodeURIComponent(RSS2JSON_KEY)+'&count=25';
    const res=await fetch(u,ctl?{signal:ctl.signal}:{});
    if(!res.ok)throw new Error('http '+res.status);
    const j=await res.json();
    if(!j||j.status!=='ok'||!Array.isArray(j.items))throw new Error('bad feed');
    return j.items.map(it=>parseNewsItem(src,it)).filter(Boolean);
  }finally{clearTimeout(timer)}
}
function readNewsCache(){
  try{const c=JSON.parse(localStorage.getItem(NEWS_KEY)||'null');if(c&&Array.isArray(c.items)&&c.at)return c}catch(e){}
  return null;
}
async function loadNews(force){
  const N=news;
  if(N.loading)return;
  if(!N.loaded){const c=readNewsCache();if(c){N.items=c.items;N.at=c.at}N.loaded=true}
  if(!force&&N.items.length&&Date.now()-N.at<600000)return;
  N.loading=true;N.error=null;
  if(ui.view==='news')renderMain();
  const res=await Promise.all(NEWS_SOURCES.map(async s=>{try{return{s:s,items:await fetchFeed(s)}}catch(e){return{s:s,items:null}}}));
  const ok=res.filter(r=>r.items);
  N.failed=res.filter(r=>!r.items).map(r=>r.s.name);
  if(ok.length){
    const seenL={},all=[];
    ok.forEach(r=>r.items.forEach(it=>{if(!seenL[it.id]){seenL[it.id]=1;all.push(it)}}));
    all.sort((a,b)=>b.ts-a.ts);
    N.items=all.slice(0,100);N.at=Date.now();
    try{localStorage.setItem(NEWS_KEY,JSON.stringify({at:N.at,items:N.items}))}catch(e){}
  }else{
    N.error=N.items.length?'Couldn\u2019t refresh. Showing the headlines saved on this device.':'Couldn\u2019t load headlines. Check your connection and try again.';
  }
  N.loading=false;
  if(ui.view==='news')renderMain();
}
function agoText(ts){
  if(!ts)return '';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'Just now';
  if(m<60)return m+' min ago';
  if(m<1440)return Math.floor(m/60)+' h ago';
  if(m<10080)return Math.floor(m/1440)+' d ago';
  return fmtDate(ymd(new Date(ts)));
}
function watchMentions(it,wl){
  const out=[];
  wl.forEach(f=>{if(it.title.indexOf(f.title)>-1)out.push(f.title)});
  return out;
}
function newsCard(it,i,mention){
  const thumb=it.thumb?'<img class="nimg" src="'+esc(it.thumb)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-src="'+esc(it.source)+'">':'<span class="nofig">'+esc(it.source)+'</span>';
  const tags=it.topics.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+(mention.length?'<span class="tag hot">Watchlist: '+esc(mention[0])+'</span>':'');
  return '<a class="ncard'+(i===0?' lead':'')+'" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(it.title+', '+it.source+', opens in a new tab')+'">'
    +'<span class="nthumb">'+thumb+'</span>'
    +'<span class="nmeta"><b>'+esc(it.source)+'</b><span>'+esc(agoText(it.ts))+'</span></span>'
    +'<h2>'+esc(it.title)+'</h2>'
    +(it.excerpt?'<p>'+esc(it.excerpt)+'</p>':'')
    +(tags?'<span class="tags">'+tags+'</span>':'')+'</a>';
}
function viewNews(){
  const N=news;
  const wl=S.watchlist.map(id=>S.films[id]).filter(f=>f&&f.title&&f.title.length>=6);
  let items=N.items.map(it=>({it:it,m:watchMentions(it,wl)}));
  items=items.filter(x=>(N.src==='All'||x.it.sid===N.src)&&(N.topic==='All'||x.it.topics.indexOf(N.topic)>-1)&&(!N.watch||x.m.length));
  const chip=(act,v,l,cur)=>'<button class="chip" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>';
  const upd=N.at?'Updated '+new Date(N.at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
  let h='<header class="page-head"><h1>News</h1><p class="sub">Casting, trailers, release dates and more from film publications.</p></header>'
    +'<div class="news-bar"><p class="sub" role="status">'+(N.loading?'Loading headlines\u2026':esc(upd))+'</p><button class="btn small" data-act="news-refresh"'+(N.loading?' disabled':'')+'>Refresh</button></div>'
    +'<section class="filters" aria-label="Filter news"><div class="chips" role="group" aria-label="Source">'+chip('news-src','All','All sources',N.src)+NEWS_SOURCES.map(s=>chip('news-src',s.id,s.name,N.src)).join('')+'</div>'
    +'<div class="chips" role="group" aria-label="Topic">'+chip('news-topic','All','All topics',N.topic)+NEWS_TOPICS.map(t=>chip('news-topic',t[0],t[0],N.topic)).join('')+'</div>'
    +'<label class="check"><input type="checkbox" data-news-watch'+(N.watch?' checked':'')+'>Only stories that mention a film on my watchlist</label></section>';
  if(N.error)h+='<p class="err" role="alert" style="margin-bottom:16px">'+esc(N.error)+'</p>';
  if(N.failed.length&&!N.error)h+='<p class="note" style="margin-bottom:16px">Couldn\u2019t load: '+esc(N.failed.join(', '))+'.</p>';
  if(items.length)h+='<div class="news-grid">'+items.map((x,i)=>newsCard(x.it,i,x.m)).join('')+'</div>';
  else if(N.loading)h+='<p class="sub" role="status">Loading headlines\u2026</p>';
  else if(N.items.length)h+='<div class="empty"><h2>No stories match these filters</h2><p>Try another source or topic.</p><button class="btn" data-act="news-clear">Clear filters</button></div>';
  else if(N.error)h+='<div class="empty"><button class="btn primary" data-act="news-refresh">Try again</button></div>';
  h+='<p class="footnote">Headlines and short excerpts come from each publication\u2019s public feed, through rss2json, and link to the original articles. Topic labels are matched from headline keywords, so they\u2019re approximate.</p>';
  return h;
}

async function pickTonight(){
  const m=ui.mood;
  let c=S.watchlist.map(id=>S.films[id]).filter(f=>f&&(m.mood==='any'||f.genres.some(g=>MOODS[m.mood].indexOf(g)>-1)));
  if(c.length>1&&m.pick&&m.pick!=='none')c=c.filter(f=>f.id!==m.pick);
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=c[i];c[i]=c[j];c[j]=t}
  m.busy=true;if(ui.view==='watchlist')renderMain();
  let chosen=null,tries=0;
  for(const f of c){
    if(m.time==='any'){chosen=f;break}
    let ff=f;
    if(!f.full&&tmdbKey()){try{ff=await details(f.id)}catch(e){}}
    if(ff.runtime&&ff.runtime<=+m.time){chosen=ff;break}
    if(++tries>=15)break;
  }
  m.busy=false;m.pick=chosen?chosen.id:'none';
  if(ui.view==='watchlist')renderMain();
}

  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='/'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();openPalette();return}
  if(e.key==='Enter'&&e.target.id==='dNewList'){e.preventDefault();createList(e.target.value,ui.film)}
  else if(e.key==='Enter'&&e.target.id==='newListInput'){e.preventDefault();createList(e.target.value)}
  else if(e.key==='Enter'&&(e.target.id==='acPass'||e.target.id==='acEmail'||e.target.id==='acUser')){e.preventDefault();acctSubmit()}
  else if(e.key==='Enter'&&e.target.id==='keyInput'){e.preventDefault();const b=$('[data-act="save-key"]');if(b)b.click()}
});

if(window.matchMedia){
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')renderSide()})}catch(e){}
}

applyTheme();
renderAll();
if(tmdbKey())loadDiscover(true);
hydrateLogged();
sbBoot();
})();

</script>
</body>
</html>

/* =====================================================================
   NEWS: headlines from film publications (RSS via rss2json)
   ===================================================================== */
const NEWS_KEY='stub_news_v1';
const news={items:[],at:0,loading:false,error:null,failed:[],loaded:false,src:'All',topic:'All',watch:false};
const NEWS_TOPICS=[
  ['Casting',/\b(cast|casts|casting|joins|joining|to star|stars in|lead role|tapped|boards|in talks|returns? as|replaces)\b/i],
  ['Trailers',/\b(trailer|teaser|first look|first-look|clip|sneak peek|poster|featurette)\b/i],
  ['Release dates',/\b(release date|dated|sets? release|premiere date|opens? in theaters|theatrical release|streaming date|moves? to|delayed|pushed)\b/i],
  ['In production',/\b(production|filming|shoot|shooting|wraps?|greenlit?|sequel|prequel|remake|reboot|adaptation|spinoff|spin-off|in development|to direct|set to write)\b/i],
  ['Box office',/\b(box office|opening weekend|grosses|opens? to \$|tops the)\b/i],
  ['Awards and festivals',/\b(oscar|oscars|academy award|emmy|golden globe|bafta|festival|cannes|venice|sundance|tiff|toronto film|award|awards|nominat)/i]
];
function decodeEnt(s){
  const named={amp:'&',lt:'<',gt:'>',quot:'"',apos:"'",nbsp:' ',hellip:'\u2026',mdash:'\u2014',ndash:'\u2013',lsquo:'\u2018',rsquo:'\u2019',ldquo:'\u201C',rdquo:'\u201D'};
  return String(s).replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi,(m,g)=>{
    if(g[0]==='#'){const n=(g[1]==='x'||g[1]==='X')?parseInt(g.slice(2),16):parseInt(g.slice(1),10);return n>0&&n<0x110000?String.fromCodePoint(n):m}
    const v=named[g.toLowerCase()];return v===undefined?m:v;
  });
}
function clip(s,n){
  s=String(s).trim();if(s.length<=n)return s;
  const c=s.slice(0,n),i=c.lastIndexOf(' ');
  return (i>n*0.6?c.slice(0,i):c).replace(/[\s,;:.\-\u2013\u2014]+$/,'')+'\u2026';
}
function newsText(html){
  let t=String(html||'').replace(/<[^>]*>/g,' ');
  t=decodeEnt(t).replace(/\s+/g,' ').trim();
  t=t.replace(/\s*The post .{0,300}? appeared first on .*$/i,'').replace(/\s*\[\u2026\]\s*$|\s*\[\.\.\.\]\s*$/,'').trim();
  return t;
}
function parseNewsItem(src,it){
  if(!it||typeof it!=='object')return null;
  const link=String(it.link||it.guid||'').trim();
  if(!/^https?:\/\//i.test(link))return null;
  const title=decodeEnt(String(it.title||'').replace(/<[^>]*>/g,' ')).replace(/\s+/g,' ').trim();
  if(!title)return null;
  const pd=String(it.pubDate||'').trim();
  let ts=/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(pd)?Date.parse(pd.replace(' ','T')+'Z'):Date.parse(pd);
  if(isNaN(ts))ts=0;
  let thumb=String(it.thumbnail||'').trim();
  if(!thumb&&it.enclosure&&it.enclosure.link&&/image/i.test(String(it.enclosure.type||'image')))thumb=String(it.enclosure.link);
  if(!thumb){const m=String(it.content||it.description||'').match(/<img[^>]+src=["']([^"']+)["']/i);if(m)thumb=m[1];}
  if(/^\/\//.test(thumb))thumb='https:'+thumb;else if(/^http:\/\//i.test(thumb))thumb='https://'+thumb.slice(7);
  thumb=/^https:\/\//i.test(thumb)?thumb:'';
  const excerpt=clip(newsText(it.description||it.content),200);
  const hay=title+' '+excerpt;
  const topics=NEWS_TOPICS.filter(t=>t[1].test(hay)).map(t=>t[0]);
  return{id:link,source:src.name,sid:src.id,title:title,link:link,ts:ts,thumb:thumb,excerpt:excerpt===title?'':excerpt,topics:topics};
}
async function fetchFeed(src){
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=setTimeout(()=>{if(ctl)ctl.abort()},12000);
  try{
    let u=RSS2JSON_URL+'?rss_url='+encodeURIComponent(src.url);
    if(RSS2JSON_KEY&&RSS2JSON_KEY.indexOf('PASTE')!==0)u+='&api_key='+encodeURIComponent(RSS2JSON_KEY)+'&count=25';
    const res=await fetch(u,ctl?{signal:ctl.signal}:{});
    if(!res.ok)throw new Error('http '+res.status);
    const j=await res.json();
    if(!j||j.status!=='ok'||!Array.isArray(j.items))throw new Error('bad feed');
    return j.items.map(it=>parseNewsItem(src,it)).filter(Boolean);
  }finally{clearTimeout(timer)}
}
function readNewsCache(){
  try{const c=JSON.parse(localStorage.getItem(NEWS_KEY)||'null');if(c&&Array.isArray(c.items)&&c.at)return c}catch(e){}
  return null;
}
async function loadNews(force){
  const N=news;
  if(N.loading)return;
  if(!N.loaded){const c=readNewsCache();if(c){N.items=c.items;N.at=c.at}N.loaded=true}
  if(!force&&N.items.length&&Date.now()-N.at<600000)return;
  N.loading=true;N.error=null;
  if(ui.view==='news')renderMain();
  const res=await Promise.all(NEWS_SOURCES.map(async s=>{try{return{s:s,items:await fetchFeed(s)}}catch(e){return{s:s,items:null}}}));
  const ok=res.filter(r=>r.items);
  N.failed=res.filter(r=>!r.items).map(r=>r.s.name);
  if(ok.length){
    const seenL={},all=[];
    ok.forEach(r=>r.items.forEach(it=>{if(!seenL[it.id]){seenL[it.id]=1;all.push(it)}}));
    all.sort((a,b)=>b.ts-a.ts);
    N.items=all.slice(0,100);N.at=Date.now();
    try{localStorage.setItem(NEWS_KEY,JSON.stringify({at:N.at,items:N.items}))}catch(e){}
  }else{
    N.error=N.items.length?'Couldn\u2019t refresh. Showing the headlines saved on this device.':'Couldn\u2019t load headlines. Check your connection and try again.';
  }
  N.loading=false;
  if(ui.view==='news')renderMain();
}
function agoText(ts){
  if(!ts)return '';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'Just now';
  if(m<60)return m+' min ago';
  if(m<1440)return Math.floor(m/60)+' h ago';
  if(m<10080)return Math.floor(m/1440)+' d ago';
  return fmtDate(ymd(new Date(ts)));
}
function watchMentions(it,wl){
  const out=[];
  wl.forEach(f=>{if(it.title.indexOf(f.title)>-1)out.push(f.title)});
  return out;
}
function newsCard(it,i,mention){
  const thumb=it.thumb?'<img class="nimg" src="'+esc(it.thumb)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-src="'+esc(it.source)+'">':'<span class="nofig">'+esc(it.source)+'</span>';
  const tags=it.topics.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+(mention.length?'<span class="tag hot">Watchlist: '+esc(mention[0])+'</span>':'');
  return '<a class="ncard'+(i===0?' lead':'')+'" href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(it.title+', '+it.source+', opens in a new tab')+'">'
    +'<span class="nthumb">'+thumb+'</span>'
    +'<span class="nmeta"><b>'+esc(it.source)+'</b><span>'+esc(agoText(it.ts))+'</span></span>'
    +'<h2>'+esc(it.title)+'</h2>'
    +(it.excerpt?'<p>'+esc(it.excerpt)+'</p>':'')
    +(tags?'<span class="tags">'+tags+'</span>':'')+'</a>';
}
function viewNews(){
  const N=news;
  const wl=S.watchlist.map(id=>S.films[id]).filter(f=>f&&f.title&&f.title.length>=6);
  let items=N.items.map(it=>({it:it,m:watchMentions(it,wl)}));
  items=items.filter(x=>(N.src==='All'||x.it.sid===N.src)&&(N.topic==='All'||x.it.topics.indexOf(N.topic)>-1)&&(!N.watch||x.m.length));
  const chip=(act,v,l,cur)=>'<button class="chip" data-act="'+act+'" data-v="'+esc(v)+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>';
  const upd=N.at?'Updated '+new Date(N.at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
  let h='<header class="page-head"><h1>News</h1><p class="sub">Casting, trailers, release dates and more from film publications.</p></header>'
    +'<div class="news-bar"><p class="sub" role="status">'+(N.loading?'Loading headlines\u2026':esc(upd))+'</p><button class="btn small" data-act="news-refresh"'+(N.loading?' disabled':'')+'>Refresh</button></div>'
    +'<section class="filters" aria-label="Filter news"><div class="chips" role="group" aria-label="Source">'+chip('news-src','All','All sources',N.src)+NEWS_SOURCES.map(s=>chip('news-src',s.id,s.name,N.src)).join('')+'</div>'
    +'<div class="chips" role="group" aria-label="Topic">'+chip('news-topic','All','All topics',N.topic)+NEWS_TOPICS.map(t=>chip('news-topic',t[0],t[0],N.topic)).join('')+'</div>'
    +'<label class="check"><input type="checkbox" data-news-watch'+(N.watch?' checked':'')+'>Only stories that mention a film on my watchlist</label></section>';
  if(N.error)h+='<p class="err" role="alert" style="margin-bottom:16px">'+esc(N.error)+'</p>';
  if(N.failed.length&&!N.error)h+='<p class="note" style="margin-bottom:16px">Couldn\u2019t load: '+esc(N.failed.join(', '))+'.</p>';
  if(items.length)h+='<div class="news-grid">'+items.map((x,i)=>newsCard(x.it,i,x.m)).join('')+'</div>';
  else if(N.loading)h+='<p class="sub" role="status">Loading headlines\u2026</p>';
  else if(N.items.length)h+='<div class="empty"><h2>No stories match these filters</h2><p>Try another source or topic.</p><button class="btn" data-act="news-clear">Clear filters</button></div>';
  else if(N.error)h+='<div class="empty"><button class="btn primary" data-act="news-refresh">Try again</button></div>';
  h+='<p class="footnote">Headlines and short excerpts come from each publication\u2019s public feed, through rss2json, and link to the original articles. Topic labels are matched from headline keywords, so they\u2019re approximate.</p>';
  return h;
}

/* ---------- Render all ---------- */
function renderAll(){renderSide();renderMain();renderDrawer()}

/* ---------- Events ---------- */
async function pickTonight(){
  const m=ui.mood;
  let c=S.watchlist.map(id=>S.films[id]).filter(f=>f&&(m.mood==='any'||f.genres.some(g=>MOODS[m.mood].indexOf(g)>-1)));
  if(c.length>1&&m.pick&&m.pick!=='none')c=c.filter(f=>f.id!==m.pick);
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=c[i];c[i]=c[j];c[j]=t}
  m.busy=true;if(ui.view==='watchlist')renderMain();
  let chosen=null,tries=0;
  for(const f of c){
    if(m.time==='any'){chosen=f;break}
    let ff=f;
    if(!f.full&&tmdbKey()){try{ff=await details(f.id)}catch(e){}}
    if(ff.runtime&&ff.runtime<=+m.time){chosen=ff;break}
    if(++tries>=15)break;
  }
  m.busy=false;m.pick=chosen?chosen.id:'none';
  if(ui.view==='watchlist')renderMain();
}
function refocus(t){
  const sel='[data-act="'+t.dataset.act+'"]'+(t.dataset.v?'[data-v="'+t.dataset.v+'"]':'');
  const n=$(sel,main);if(n)n.focus({preventScroll:true});
}
function setView(v){
  ui.view=v;
  if(drawer.classList.contains('open'))closeDrawer();
  renderSide();renderMain();window.scrollTo(0,0);
  if(v==='stats'||v==='watchlist')hydrateLogged();
  if(v==='friends')enterFriends();
  if(v==='news')loadNews(false);
  if(v==='discover'&&tmdbKey()&&!ui.disc.items.length&&!ui.disc.loading)loadDiscover(true);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const act=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  if(ui.confirm&&act!=='delete-list'&&act!=='reset'&&act!=='delete-acct'){ui.confirm=null;renderSide();renderMain()}
  if(socialAction(act,t))return;
  switch(act){
    case 'noop':break;
    case 'news-src':news.src=v;renderMain();refocus(t);break;
    case 'news-topic':news.topic=v;renderMain();refocus(t);break;
    case 'news-clear':news.src='All';news.topic='All';news.watch=false;renderMain();break;
    case 'news-refresh':loadNews(true);break;
    case 'view':setView(v);break;
    case 'goto-settings':closePalette();setView('settings');break;
    case 'open':openFilm(id,false);break;
    case 'close':closeDrawer();break;
    case 'palette':openPalette();break;
    case 'close-palette':closePalette();break;
    case 'pick':closePalette();openFilm(id,true);break;
    case 'genre':ui.filters.genre=v;loadDiscover(true);refocus(t);break;
    case 'clear-filters':ui.filters={genre:'All',decade:'Any',length:'Any',sort:'popular',hideSeen:false};loadDiscover(true);break;
    case 'retry-discover':loadDiscover(ui.disc.items.length?false:true);break;
    case 'more-discover':loadDiscover(false);break;
    case 'mood-time':ui.mood.time=v;ui.mood.pick=null;renderMain();refocus(t);break;
    case 'mood-mood':ui.mood.mood=v;ui.mood.pick=null;renderMain();refocus(t);break;
    case 'pick-tonight':pickTonight();break;
    case 'theme':S.theme=effTheme()==='dark'?'light':'dark';save();applyTheme();renderSide();break;
    case 'reset':
      if(ui.confirm==='reset'){ui.confirm=null;mutate('Cleared everything',()=>{S.logs=[];S.watchlist=[];S.lists=[]})}
      else{ui.confirm='reset';renderSide()}
      break;
    case 'undo':if(lastSnap){const s=lastSnap;lastSnap=null;undoTo(s)}break;
    case 'want':{
      const f=film(ui.film),on=S.watchlist.includes(f.id);
      mutate(on?'Removed '+f.title+' from your watchlist':'Added '+f.title+' to your watchlist',()=>{keep(f.id);S.watchlist=on?S.watchlist.filter(x=>x!==f.id):S.watchlist.concat(f.id)});
      break;
    }
    case 'watched':{
      const f=film(ui.film);
      mutate('Marked '+f.title+' as watched',()=>{addLog(f.id,0);S.watchlist=S.watchlist.filter(x=>x!==f.id)});
      break;
    }
    case 'again':{
      const f=film(ui.film);let nid=null;
      mutate('Logged another viewing of '+f.title,()=>{nid=addLog(f.id,ratingOf(f.id),{rewatch:true}).id});
      ui.editLog=nid;renderDrawer();
      break;
    }
    case 'edit-log':ui.editLog=id;renderDrawer();break;
    case 'cancel-edit':ui.editLog=null;renderDrawer();break;
    case 'save-log':{
      const lid=id,date=$('#eDate',drawer).value,rew=$('#eRew',drawer).checked,rev=$('#eRev',drawer).value.trim();
      ui.editLog=null;
      mutate('Saved your viewing',()=>{const l=S.logs.find(x=>x.id===lid);if(!l)return;if(date)l.date=date>today()?today():date;l.rewatch=rew;l.review=rev.slice(0,2000)});
      break;
    }
    case 'del-log':{
      const lid=id;ui.editLog=null;
      mutate('Deleted that viewing',()=>{S.logs=S.logs.filter(x=>x.id!==lid)});
      break;
    }
    case 'toggle-list':{
      const L=S.lists.find(x=>x.id===id);if(!L)break;
      const fid=ui.film,on=L.films.includes(fid);
      mutate((on?'Removed from \u201c':'Added to \u201c')+L.name+'\u201d',()=>{keep(fid);L.films=on?L.films.filter(x=>x!==fid):L.films.concat(fid)});
      break;
    }
    case 'new-list-from-film':{const inp=$('#dNewList',drawer);if(inp)createList(inp.value,ui.film);break}
    case 'create-list':{const inp=$('#newListInput');if(inp)createList(inp.value);break}
    case 'delete-list':{
      const L=S.lists.find(x=>x.id===id);if(!L)break;
      if(ui.confirm==='del:'+id){ui.confirm=null;mutate('Deleted \u201c'+L.name+'\u201d',()=>{S.lists=S.lists.filter(x=>x.id!==id)})}
      else{ui.confirm='del:'+id;renderMain()}
      break;
    }
    case 'save-key':{
      const inp=$('#keyInput'),val=inp?inp.value.trim():'';
      if(!val){ui.keyMsg='Paste your key first.';renderMain();break}
      try{localStorage.setItem(KEY_TMDB,val)}catch(err){ui.keyMsg='This browser blocked saving the key.';renderMain();break}
      ui.keyMsg='Checking the key\u2026';renderMain();
      tmdb('/configuration').then(()=>{ui.keyMsg='Connected. Your key is saved in this browser.';ui.disc=newDisc();if(ui.view==='settings')renderMain();loadDiscover(true)})
        .catch(err=>{ui.keyMsg=err.message==='badkey'?'TMDB rejected that key. Check that you copied all of it.':'Saved, but we couldn\u2019t reach TMDB to check it'+why(err)+'.';if(ui.view==='settings')renderMain()});
      break;
    }
    case 'remove-key':
      try{localStorage.removeItem(KEY_TMDB)}catch(err){}
      ui.keyMsg='Key removed.';ui.disc=newDisc();renderMain();break;
    case 'imp-reset':ui.imp.phase='idle';ui.imp.data=null;ui.imp.msg='';ui.imp.result=null;ui.imp.snap=null;renderMain();break;
    case 'start-import':runImport();break;
    case 'undo-import':
      if(ui.imp.snap){Object.assign(S,JSON.parse(ui.imp.snap));save();ui.imp.phase='idle';ui.imp.data=null;ui.imp.result=null;ui.imp.snap=null;renderAll();toast('Import undone')}
      break;
    case 'download-backup':{
      const blob=new Blob([JSON.stringify({app:'stub',version:1,exported:new Date().toISOString(),logs:S.logs,watchlist:S.watchlist,lists:S.lists,films:S.films,nextId:S.nextId})],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stub-backup-'+today()+'.json';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),1500);
      toast('Backup downloaded');
      break;
    }
    case 'restore-no':ui.restore=null;ui.restoreMsg='';renderMain();break;
    case 'restore-yes':{
      const o=ui.restore;if(!o)break;
      ui.restore=null;
      mutate('Restored your backup',()=>{
        S.logs=fixLogIds(o.logs);S.watchlist=o.watchlist;S.lists=o.lists;
        Object.keys(o.films||{}).forEach(k=>{S.films[k]=o.films[k]});
        S.nextId=Math.max(o.nextId||1,S.nextId);
      });
      hydrateLogged();
      break;
    }
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.newsWatch!==undefined){news.watch=t.checked;renderMain();return}
  if(t.id==='impFiles'){if(t.files&&t.files.length)readImportFiles(t.files);return}
  if(t.id==='restoreFile'){
    const file=t.files&&t.files[0];if(!file)return;
    ui.restoreMsg='';
    file.text().then(txt=>{
      const o=JSON.parse(txt);
      if(!o||!Array.isArray(o.logs)||!Array.isArray(o.watchlist)||!Array.isArray(o.lists))throw new Error('shape');
      ui.restore=o;renderMain();
    }).catch(()=>{ui.restore=null;ui.restoreMsg='That file isn\u2019t a Stub backup.';renderMain()});
    return;
  }
  if(t.dataset&&t.dataset.imp){ui.imp.opts[t.dataset.imp]=t.checked;return}
  if(!t.dataset||!t.dataset.filter)return;
  const k=t.dataset.filter;
  ui.filters[k]=t.type==='checkbox'?t.checked:t.value;
  if(k==='hideSeen')renderMain();else loadDiscover(true);
  const n=$('[data-filter="'+k+'"]',main);if(n)n.focus({preventScroll:true});
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!palette.hidden){closePalette();return}
    if(drawer.classList.contains('open'))closeDrawer();
    return;
  }
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='/'&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();openPalette();return}
  if(e.key==='Enter'&&e.target.id==='dNewList'){e.preventDefault();createList(e.target.value,ui.film)}
  else if(e.key==='Enter'&&e.target.id==='newListInput'){e.preventDefault();createList(e.target.value)}
  else if(e.key==='Enter'&&(e.target.id==='acPass'||e.target.id==='acEmail'||e.target.id==='acUser')){e.preventDefault();acctSubmit()}
  else if(e.key==='Enter'&&e.target.id==='keyInput'){e.preventDefault();const b=$('[data-act="save-key"]');if(b)b.click()}
});

if(window.matchMedia){
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')renderSide()})}catch(e){}
}

applyTheme();
renderAll();
if(tmdbKey())loadDiscover(true);
hydrateLogged();
sbBoot();
})();

</script>
